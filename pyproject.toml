[project]
name = "high-throughput-vllm-deployment"
version = "0.1.0"
description = "High-throughput vLLM serving deployment with load-testing and verification harness."
readme = "README.md"
authors = [
    { name = "mikeZ98", email = "145975972+mikeZ98@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.16.2",
    "httpx>=0.27.0",
]

[dependency-groups]
# Shipped in the container image (`uv sync --no-dev --group loadtest`).
loadtest = [
    "locust>=2.31.0",
]
dev = [
    { include-group = "loadtest" },
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-socket>=0.7.0",
    "hypothesis>=6.100.0",
    "types-pyyaml>=6.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- #
# uv                                                                           #
# --------------------------------------------------------------------------- #
[tool.uv]
cache-dir = "./.cache/uv"

# --------------------------------------------------------------------------- #
# ruff                                                                         #
# --------------------------------------------------------------------------- #
[tool.ruff]
cache-dir = "./.cache/ruff"
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "C4", "T201"]

[tool.ruff.lint.per-file-ignores]
# Bare `assert` is the pytest idiom.
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["high_throughput_vllm_deployment"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy                                                                         #
# --------------------------------------------------------------------------- #
[tool.mypy]
strict = true
cache_dir = "./.cache/mypy"
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

# Locust's event hooks and clients are untyped; confine the relaxation to the
# one module that touches them.
[[tool.mypy.overrides]]
module = ["high_throughput_vllm_deployment.benchmarks.locustfile", "test_bench_locust"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest                                                                       #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.2"
# --capture=sys: in-memory capture. The default fd capture creates its temp
# files at startup, before conftest can re-anchor `tempfile`, i.e. on the host
# temp dir instead of ./.cache/tmp.
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost --capture=sys"
cache_dir = "./.cache/pytest"
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# coverage                                                                     #
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
data_file = "./.cache/coverage/.coverage"
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "./.cache/coverage/html"

[tool.coverage.xml]
output = "./.cache/coverage/coverage.xml"
