new = '"0.0.0.0:${VLLM_DEPLOYMENT_PORT:-8000}:8000"'
tests = ["tests/test_docker.py"]
expect = "test_published_ports_bind_to_loopback"

[[mutant]]
id = "docker-mock-port-all-interfaces"
suite = "docker"
description = "Mock server published on 0.0.0.0 instead of loopback"
file = "compose.yaml"
old = '"127.0.0.1:${MOCK_PORT:-8001}:8000"'
new = '"0.0.0.0:${MOCK_PORT:-8001}:8000"'
tests = ["tests/test_docker.py"]
expect = "test_published_ports_bind_to_loopback"

[[mutant]]
id = "docker-compose-runs-as-root"
suite = "docker"
description = "App containers run as root in Compose"
file = "compose.yaml"
old = 'user: "10001:10001"'
new = 'user: "0:0"'
tests = ["tests/test_docker.py"]
expect = "test_app_services_are_hardened"

[[mutant]]
id = "docker-capabilities-retained"
suite = "docker"
description = "App containers keep the default Linux capabilities"
file = "compose.yaml"
old = '''
  cap_drop:
    - ALL
'''
new = '''
  cap_drop: []
'''
tests = ["tests/test_docker.py"]
expect = "test_app_services_are_hardened"

[[mutant]]
id = "docker-gpu-reservation-dropped"
suite = "docker"
description = "vLLM service no longer reserves NVIDIA GPUs"
file = "compose.yaml"
old = 'capabilities: [gpu]'
new = 'capabilities: [compute]'
tests = ["tests/test_docker.py"]
expect = "test_vllm_server_reserves_gpus"
