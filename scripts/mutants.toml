# Mutation fault-injection catalogue for scripts/run_mutations.sh.
#
# Every mutant replaces one exact, unique `old` snippet of `file` with `new`,
# runs only `tests`, and counts as KILLED only if pytest reports an assertion
# failure whose "FAILED <node> - <message>" line matches the `expect` regex.
# Timeouts, crashes and failures for other reasons are survivors (fail-closed).
#
# Each mutant encodes a plausible regression; together they prove that the
# suite guards every documented invariant. Python mutants must change the AST.

# =========================================================================== #
# schemas: contract relaxation                                                #
# =========================================================================== #

[[mutant]]
id = "schemas-base-accepts-nan"
suite = "schemas"
description = "Shared base stops rejecting NaN/Infinity floats"
file = "src/high_throughput_vllm_deployment/schemas/_base.py"
old = 'allow_inf_nan=False,'
new = 'allow_inf_nan=True,'
tests = ["tests/schemas/test_schema_base.py"]
expect = "test_non_finite_floats_are_rejected"

